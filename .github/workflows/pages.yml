name: pages
on:
  push:
    branches: [main]
    paths: ["results/site/**", "results/live/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Verified study at /, Live study at /live/ (both generated pages, checked by ci.yml).
      - run: |
          mkdir -p _site/live
          cp -R results/site/. _site/
          cp -R results/live/site/. _site/live/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
